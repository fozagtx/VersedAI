# VersedAI frontend — Next.js on Render
# Dashboard: New Blueprint → this repo → render.yaml
# Expected URL: https://versedai.onrender.com

services:
  - type: web
    name: versedai
    runtime: node
    plan: free
    region: oregon
    rootDir: client
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    buildFilter:
      paths:
        - client/**
        - render.yaml
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: BACKEND_URL
        value: https://versedai-agent-158479424670.us-central1.run.app
